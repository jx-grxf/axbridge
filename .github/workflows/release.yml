name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./mcp/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci && npm run build && npm test
        working-directory: mcp
      # Trusted publishing: npm checks this workflow's OIDC token, no secret is stored.
      - run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: mcp
      - name: GitHub release from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "axbridge $version" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
